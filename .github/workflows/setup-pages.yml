name: Setup GitHub Pages

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setup Pages workflow triggered."

  configure-pages:
    if: ${{ secrets.ADMIN_TOKEN != null && secrets.ADMIN_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages to use gh-pages
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cat > pages.json << 'JSON'
          {
            "source": {"branch": "gh-pages", "path": "/"}
          }
          JSON

          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/pages" \
            --data-binary @pages.json

  note-if-missing:
    if: ${{ secrets.ADMIN_TOKEN == null || secrets.ADMIN_TOKEN == '' }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Explain setup
        run: |
          echo "ADMIN_TOKEN secret not set."
          echo "Create a fine-grained PAT with admin permissions on this repo,"
          echo "add it as 'ADMIN_TOKEN' in Repository Secrets, then re-run this workflow."
