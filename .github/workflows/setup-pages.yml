name: Setup GitHub Pages

on:
  workflow_dispatch:
 
env:
  ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Start
        run: echo "Setup Pages workflow triggered."
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages to use gh-pages
        if: ${{ env.ADMIN_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cat > pages.json << 'JSON'
          {
            "source": {"branch": "gh-pages", "path": "/"}
          }
          JSON

          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/pages" \
            --data-binary @pages.json

      - name: Explain setup
        if: ${{ env.ADMIN_TOKEN == '' }}
        run: |
          echo "ADMIN_TOKEN secret not set."
          echo "Create a fine-grained PAT with admin permissions on this repo,"
          echo "add it as 'ADMIN_TOKEN' in Repository Secrets, then re-run this workflow."
