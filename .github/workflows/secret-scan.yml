name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - public-prep
      - main

jobs:
  gitleaks-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Gitleaks
        run: |
          ver=8.30.0
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks (PR, non-blocking)
        run: |
          gitleaks detect --no-git --redact --verbose --report-format json --report-path gitleaks-pr.json || true

  gitleaks-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          ver=8.30.0
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks (Push, blocking)
        run: |
          gitleaks detect --redact --verbose --report-format json --report-path gitleaks-push.json